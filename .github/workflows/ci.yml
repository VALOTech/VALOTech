name: CI

# The gates that hold this repository's documents together, run on the server as
# well as in the pre-push hook. The hook is the fast feedback; this is what
# catches a push that bypassed it, and it is the only check that runs on a
# machine nobody configured.
#
# It runs `make check` rather than a list of scripts. A workflow that enumerates
# its own gates drifts from the Makefile the first time a gate is added, and what
# it then reports is not that a check failed but that no check ran -- which is
# exactly what happened here: nine gates were added and this file went on running
# four of them.
#
# Which target runs follows what is being checked. `main` carries the site and
# none of the planning documents, so the gates that read those documents have
# nothing to say about it; coupling a live stylesheet fix to the state of a
# design backlog would make the published page hostage to planning. The pre-push
# hook makes the same split for the same reason.
#
# Jobs for lint, types, build and tests land with the first application code,
# because a job that checks nothing has only ever passed.
#
# Actions are pinned to a commit SHA with the tag in a comment: a tag is a
# moving reference, and a supply-chain compromise of a popular action is a
# compromise of every repository that names it by tag.

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [development, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      # The site gates only, on the published branch: it carries no PRD, no
      # designs, no ledger and no register, so the gates that read them would be
      # reporting on files that are absent by design.
      - name: Every gate that guards what main publishes
        if: github.ref == 'refs/heads/main'
        run: make check-site

      # Everything, on the branch that carries everything. `make check` is the
      # same chain the pre-push hook runs, so a push that bypassed the hook is
      # caught here by the identical set rather than by a subset of it.
      - name: Every gate this repository has
        if: github.ref != 'refs/heads/main'
        run: make check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # gitleaks reads history, so a shallow clone would scan one commit and
          # report clean for a secret committed yesterday.
          fetch-depth: 0

      # The published action refuses to run for an organisation without a paid
      # licence key, so the binary is run directly and pinned by release --
      # which is what VALO Ads does, and what keeps working when this
      # repository goes private (docs/decisions-log.md#INFRA-DEC-04).
      - name: gitleaks, full history
        run: |
          set -euo pipefail
          VERSION="8.30.0"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
