# gitleaks configuration for VALO Tech.
#
# The repository is the deployed artifact for a public site, so a secret
# committed here is a secret published. The default rule set does the work;
# what is configured is the small set of paths where a high-entropy string is
# expected and means nothing.

title = "VALO Tech"

[extend]
useDefault = true

[allowlist]
description = "Paths whose high-entropy strings are not secrets"
paths = [
  # A vendored graphics library: minified source is entropy by construction.
  '''assets/scene/three\.module\.min\.js''',
  # Binary assets: fonts, textures, icons, flags.
  '''assets/(fonts|textures|icons|flags)/.*''',
]

# A content allow, not a path allow: env.example carries one development-local
# literal — the throwaway valotech:valotech on the loopback — and allowing the
# whole file by path would exempt a real credential pasted into the one file
# developers paste connection strings into. This clears that exact string
# wherever it appears; any other secret in env.example still trips.
regexes = [
  '''postgres://valotech:valotech@127\.0\.0\.1:5434/valotech''',
]
