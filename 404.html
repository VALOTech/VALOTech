    }
    main{max-width:56ch;text-align:center}
    .mark{

      font-family:var(--mono);font-size:11px;font-weight:500;

    }

    .btn{
      display:inline-flex;align-items:center;gap:10px;
      padding:12px 22px;border-radius:999px;border:1px solid transparent;
      background:var(--accent-bright);color:#07071a;
      font-family:inherit;font-size:15px;font-weight:600;line-height:1;text-decoration:none;
      box-shadow:0 0 34px rgba(140,158,255,.34);
      transition:background .25s cubic-bezier(.16,1,.3,1),transform .25s cubic-bezier(.16,1,.3,1);
    }
    .btn:hover{background:#fff;transform:translateY(-1px)}
    .btn svg{width:16px;height:16px;fill:currentColor}
    a:focus-visible,.btn:focus-visible{outline:2px solid var(--accent-bright);outline-offset:3px}
    @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
    @media print{
      body{background:#fff;color:#000}
      h1,p,.code,.mark{color:#000}
      .code{border-color:#999;background:none}
