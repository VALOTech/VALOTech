<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shimmra mark">
  <title>Shimmra orbit-star mark</title>
  <!-- The bare orbit-star (no plate): a bright four-point star (the idol) inside
       an azure -> cyan halo-orbit carrying satellite sparks (the fans). The
       orbit is the halo. For use over dark surfaces where a plate would box the
       glow in. The plated form is shimmra-icon.svg. -->
  <defs>
    <linearGradient id="mk-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F63E6"/><stop offset=".5" stop-color="#3B86FF"/><stop offset="1" stop-color="#62E8FF"/>
    </linearGradient>
    <radialGradient id="mk-star" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#CFF4FF"/><stop offset="1" stop-color="#62E8FF"/>
    </radialGradient>
    <radialGradient id="mk-node" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#DDF7FF"/><stop offset="1" stop-color="#3B86FF"/>
    </radialGradient>
    <filter id="mk-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mk-glows" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="256" cy="256" rx="172" ry="92" transform="rotate(-24 256 256)" fill="none" stroke="url(#mk-ring)" stroke-width="7" opacity="0.45" filter="url(#mk-glows)"/>
  <path d="M 118 322 A 172 92 -24 0 1 300 130" fill="none" stroke="url(#mk-ring)" stroke-width="12" stroke-linecap="round" opacity="0.9" filter="url(#mk-glow)"/>
  <g transform="translate(256,256) scale(2.7)" filter="url(#mk-glow)">
    <path d="M0,-30 C4.5,-9 9,-4.5 30,0 C9,4.5 4.5,9 0,30 C-4.5,9 -9,4.5 -30,0 C-9,-4.5 -4.5,-9 0,-30 Z" fill="url(#mk-star)"/>
  </g>
  <g transform="translate(398,186) scale(0.62)" filter="url(#mk-glow)">
    <path d="M0,-30 C4.5,-9 9,-4.5 30,0 C9,4.5 4.5,9 0,30 C-4.5,9 -9,4.5 -30,0 C-9,-4.5 -4.5,-9 0,-30 Z" fill="url(#mk-node)"/>
  </g>
  <circle cx="118" cy="322" r="10" fill="url(#mk-node)" filter="url(#mk-glow)"/>
</svg>
